<!-- Main Headline -->
<h1 class="font-child-hero text-child-hero text-primary text-center mb-10 drop-shadow-sm">
            It's time to relax! 🌟
        </h1>
<!-- Suggestions Bento Box -->
<div class="w-full bg-surface-container-low rounded-[32px] p-child-padding-v shadow-xl shadow-primary/5 border border-surface-variant">
<h2 class="font-child-subtitle text-child-subtitle text-on-surface-variant text-center mb-6">
                How about we...
            </h2>
<div class="grid grid-cols-2 gap-child-gap">
<!-- Suggestion Card 1 -->
<button class="bg-surface-container-lowest rounded-2xl p-4 flex flex-col items-center justify-center gap-3 border-b-[6px] border-secondary-fixed shadow-sm hover:brightness-95 active:border-b-0 active:translate-y-[6px] transition-all duration-150">
<div class="w-16 h-16 rounded-full bg-secondary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="palette">palette</span>
</div>
<span class="font-child-body text-child-body text-on-surface">Draw a picture</span>
</button>
<!-- Suggestion Card 2 -->
<button class="bg-surface-container-lowest rounded-2xl p-4 flex flex-col items-center justify-center gap-3 border-b-[6px] border-tertiary-fixed shadow-sm hover:brightness-95 active:border-b-0 active:translate-y-[6px] transition-all duration-150">
<div class="w-16 h-16 rounded-full bg-tertiary-fixed flex items-center justify-center text-on-tertiary-container">
<span class="material-symbols-outlined text-4xl" data-icon="extension">extension</span>
</div>
<span class="font-child-body text-child-body text-on-surface">Play with toys</span>
</button>
<!-- Suggestion Card 3 -->
<button class="bg-surface-container-lowest rounded-2xl p-4 flex flex-col items-center justify-center gap-3 border-b-[6px] border-[#c2f0c2] shadow-sm hover:brightness-95 active:border-b-0 active:translate-y-[6px] transition-all duration-150">
<div class="w-16 h-16 rounded-full bg-[#e6f9e6] flex items-center justify-center text-[#2e6b2e]">
<span class="material-symbols-outlined text-4xl" data-icon="park">park</span>
</div>
<span class="font-child-body text-child-body text-on-surface">Go outside</span>
</button>
<!-- Suggestion Card 4 -->
<button class="bg-surface-container-lowest rounded-2xl p-4 flex flex-col items-center justify-center gap-3 border-b-[6px] border-secondary-fixed-dim shadow-sm hover:brightness-95 active:border-b-0 active:translate-y-[6px] transition-all duration-150">
<div class="w-16 h-16 rounded-full bg-inverse-on-surface flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-4xl" data-icon="menu_book">menu_book</span>
</div>
<span class="font-child-body text-child-body text-on-surface">Read a book</span>

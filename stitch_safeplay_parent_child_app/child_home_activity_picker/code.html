<body class="bg-surface text-on-surface min-h-screen flex flex-col font-sans">
<!-- TopAppBar -->
<header class="bg-primary dark:bg-primary-container docked full-width top-0 rounded-b-xl shadow-xl shadow-primary/20 fixed w-full z-50 flex justify-between items-center px-parent-padding-h h-16">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-primary">timer</span>
<h1 class="font-parent-title text-parent-title font-bold text-on-primary">SafePlay Timer</h1>
</div>
<div>
<span class="material-symbols-outlined text-on-primary">lock</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-child-padding-h flex flex-col items-center max-w-4xl mx-auto w-full">
<!-- Welcome Hero -->
<div class="w-full text-center mb-8">
<h2 class="font-child-hero text-child-hero text-primary mb-2">Hi Leo!</h2>
<p class="font-child-subtitle text-child-subtitle text-secondary">Ready for an adventure today?</p>
<div class="mt-6 inline-flex items-center gap-2 bg-surface-container-high px-6 py-3 rounded-full shadow-lg shadow-primary/10 border-b-4 border-outline-variant/30">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-child-subtitle text-child-subtitle text-on-surface-variant">45:00 remaining</span>
</div>
</div>
<!-- Activity Grid (Bento Style) -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-child-gap">
<!-- Educational Stories -->
<button class="bg-secondary-container hover:opacity-90 active:scale-95 transition-all rounded-[24px] p-8 min-h-[180px] flex flex-col items-center justify-center gap-4 shadow-xl shadow-secondary-container/30 border-b-8 border-secondary-fixed-dim text-center relative overflow-hidden group">
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="bg-white rounded-full p-4 shadow-sm">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">menu_book</span>
</div>
<h3 class="font-child-title text-child-title text-on-secondary-container">Stories</h3>
</button>
<!-- Brain Games -->
<button class="bg-error-container hover:opacity-90 active:scale-95 transition-all rounded-[24px] p-8 min-h-[180px] flex flex-col items-center justify-center gap-4 shadow-xl shadow-error-container/30 border-b-8 border-[#ffb4ab] text-center relative overflow-hidden group">
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="bg-white rounded-full p-4 shadow-sm">
<span class="material-symbols-outlined text-[48px] text-error" style="font-variation-settings: 'FILL' 1;">extension</span>
</div>
<h3 class="font-child-title text-child-title text-on-error-container">Games</h3>
</button>
<!-- Creative Activities -->
<button class="bg-tertiary-container hover:opacity-90 active:scale-95 transition-all rounded-[24px] p-8 min-h-[180px] flex flex-col items-center justify-center gap-4 shadow-xl shadow-tertiary-container/30 border-b-8 border-tertiary-fixed-dim text-center relative overflow-hidden group">
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="bg-white rounded-full p-4 shadow-sm">
<span class="material-symbols-outlined text-[48px] text-tertiary" style="font-variation-settings: 'FILL' 1;">palette</span>
</div>
<h3 class="font-child-title text-child-title text-on-tertiary-container">Create</h3>
</button>
<!-- Educational Videos -->
<button class="bg-surface-variant hover:opacity-90 active:scale-95 transition-all rounded-[24px] p-8 min-h-[180px] flex flex-col items-center justify-center gap-4 shadow-xl shadow-surface-variant/30 border-b-8 border-outline-variant text-center relative overflow-hidden group">
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="bg-white rounded-full p-4 shadow-sm">
<span class="material-symbols-outlined text-[48px] text-secondary" style="font-variation-settings: 'FILL' 1;">smart_display</span>

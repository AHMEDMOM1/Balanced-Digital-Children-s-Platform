      min-height: max(884px, 100dvh);

<body class="bg-surface-bright text-on-surface min-h-screen font-sans antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-parent-padding-h h-16 bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container rounded-b-xl shadow-xl shadow-primary/20">
<button class="flex items-center justify-center p-2 rounded-full hover:opacity-80 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]">timer</span>
</button>
<h1 class="text-parent-title font-parent-title font-bold text-on-primary text-center flex-1">SafePlay Timer</h1>
<button class="flex items-center justify-center p-2 rounded-full hover:opacity-80 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]">lock</span>
</button>
</header>
<!-- Main Canvas -->
<main class="pt-[100px] pb-[120px] px-parent-padding-h max-w-3xl mx-auto flex flex-col items-center">
<!-- Hero Section -->
<div class="w-full mb-8 rounded-xl h-48 bg-cover bg-center shadow-xl shadow-primary/10 flex items-center justify-center relative overflow-hidden" data-alt="A soft, dreamlike 3D rendered illustration of a magical playroom filled with oversized, rounded geometric shapes in pastel peach, coral, and soft yellow hues. The scene is lit by warm, diffused sunlight creating a comforting, safe, and playful atmosphere typical of a high-end modern children's app design. The overall aesthetic is clean, minimalist, and highly tactile." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCcD1nTKwJ3hTZ84JUP-5q6LruF7Y4pSh6QHG_prLexjf_VtNop2_SPWY_yutgoV50j2BDhYEOreIJ9iGR5lw0PK9fbK5SGi7h_qQxL26M4hm13YX3wFIaM1Kza1RyGQuVTTS__IpvXHABj0I8crIVmAayD9HURksdd0RTNcFi89cf7e4D59zBJLEDx8Rhp6nLtYYjUYZk0O-Xz2Y5tgVtGnDrysgkNdBdQVyZOWaaI9RvYZOOEsq0NWyYq3cAX0aDupaNUN3VJr6w');">
<div class="absolute inset-0 bg-surface-bright/60 backdrop-blur-sm"></div>
<h2 class="font-child-hero text-child-hero text-primary relative z-10 text-center px-4">
                Ready to Play?
            </h2>
</div>
<!-- Activity Grid -->
<div class="grid grid-cols-2 gap-child-gap w-full">
<!-- Card 1 -->
<button class="col-span-2 sm:col-span-1 bg-error-container text-on-error-container rounded-xl p-child-padding-v flex flex-col items-center justify-center gap-4 shadow-xl shadow-error-container/40 border-b-[6px] border-error/20 active:translate-y-1 active:border-b-0 active:mb-[6px] transition-all hover:bg-[#ffd0cb]">
<span class="material-symbols-outlined text-[64px] text-on-error-container/90">extension</span>
<span class="font-child-title text-child-title">Puzzle Party</span>
</button>
<!-- Card 2 -->
<button class="col-span-1 bg-tertiary-fixed text-on-tertiary-fixed rounded-xl p-child-padding-v flex flex-col items-center justify-center gap-4 shadow-xl shadow-tertiary-fixed/40 border-b-[6px] border-tertiary/20 active:translate-y-1 active:border-b-0 active:mb-[6px] transition-all hover:bg-[#ffdb80]">
<span class="material-symbols-outlined text-[56px] text-on-tertiary-fixed/90">category</span>
<span class="font-child-subtitle text-child-subtitle text-center w-full">Shape Match</span>
</button>
<!-- Card 3 -->
<button class="col-span-1 bg-secondary-container text-on-secondary-container rounded-xl p-child-padding-v flex flex-col items-center justify-center gap-4 shadow-xl shadow-secondary-container/40 border-b-[6px] border-secondary/20 active:translate-y-1 active:border-b-0 active:mb-[6px] transition-all hover:bg-[#d5c5fa]">
<span class="material-symbols-outlined text-[56px] text-on-secondary-container/90">palette</span>
<span class="font-child-subtitle text-child-subtitle text-center w-full">Color Quest</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-4 bg-surface-container-lowest border-t border-outline-variant md:hidden">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-bold w-full h-full hover:bg-surface-container-high transition-colors active:scale-98" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-parent-caption text-parent-caption mt-1">Home</span>
</a>
<!-- Reports -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline w-full h-full hover:bg-surface-container-high transition-colors active:scale-98" href="#">
<span class="material-symbols-outlined">analytics</span>
<span class="font-parent-caption text-parent-caption mt-1">Reports</span>
</a>
<!-- Control -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline w-full h-full hover:bg-surface-container-high transition-colors active:scale-98" href="#">
<span class="material-symbols-outlined">tune</span>
<span class="font-parent-caption text-parent-caption mt-1">Control</span>
</a>
<!-- Settings -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline w-full h-full hover:bg-surface-container-high transition-colors active:scale-98" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-parent-caption text-parent-caption mt-1">Settings</span>
</a>
</nav>

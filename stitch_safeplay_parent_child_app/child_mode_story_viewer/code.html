<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Top Navigation Area (Child Mode - Minimalist/Playful) -->
<header class="w-full max-w-4xl mx-auto px-child-padding-h py-child-padding-v flex justify-between items-center z-10 relative">
<button aria-label="Go Back" class="w-14 h-14 bg-surface rounded-full shadow-child-card flex items-center justify-center text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined text-3xl font-bold" style="font-variation-settings: 'FILL' 1;">close</span>
</button>
<div class="flex items-center gap-3 bg-surface px-6 py-3 rounded-full shadow-child-card">
<span class="material-symbols-outlined text-secondary font-bold text-2xl">menu_book</span>
<span class="font-child-subtitle text-child-subtitle text-secondary">The Little Explorer</span>
</div>
<button aria-label="Audio Read" class="w-14 h-14 bg-surface rounded-full shadow-child-card flex items-center justify-center text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined text-3xl font-bold" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</header>
<!-- Main Story Canvas -->
<main class="flex-grow w-full max-w-4xl mx-auto px-child-padding-h pb-child-padding-v flex flex-col justify-center items-center relative gap-8">
<!-- The Book / Card -->
<article class="w-full bg-[#E8E0FF] rounded-[2.5rem] shadow-child-card overflow-hidden flex flex-col relative z-10 border-4 border-white/50">
<!-- Illustration Area -->
<div class="w-full h-[353px] min-h-[300px] relative bg-white">
<img alt="Story Illustration" class="w-full h-full object-cover rounded-t-[2.5rem]" data-alt="A vibrant, playful, soft-skeuomorphic 3D illustration suitable for a children's storybook app. The scene depicts a cute, fluffy animal character, perhaps a small bear or rabbit, wearing a tiny explorer's backpack, looking curiously at a glowing, magical mushroom in a sunny, stylized forest. The colors are high-contrast, joyful, and pastel-leaning, utilizing soft purples, bright greens, and warm yellows. The lighting is soft and cheerful, creating a squishy, tactile, and highly inviting atmosphere that encourages interaction and delight." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDIkjfhM0_mVklYOPymkQzcJsPrzJdCVUDc-AoncpPL1n7k_wMKob39z7UQ3R0Kt8lUzFiEfRq6FMfQgkPORH1I2kDv8PWBn2opIcxz3GVqkl2mapY_8SMZvieaZ012wiMK9GfiuHpzoCwKhnthWYanI6zKt-hIwzWiEXDlbGGefInO_TXHPErkn2mMq-lcKekHgSZgUKGb1FGeRcufiMxWLiW1Bxyek4KY6unqnMBE0mOhsIiXhufUC9NY1dl23WENk-2410FQBh8"/>
<!-- Page Indicator Pill -->
<div class="absolute bottom-4 right-4 bg-white/90 backdrop-blur-sm px-4 py-2 rounded-full font-child-subtitle text-child-subtitle text-primary shadow-sm border-2 border-white/50">
                    Page 3 of 12
                </div>
</div>
<!-- Text Area -->
<div class="p-8 md:p-12 text-center bg-[#E8E0FF]">
<p class="font-child-hero text-child-hero text-on-surface leading-tight md:leading-snug">
                    Pip found a glowing rock under the big oak tree. "I wonder if it's magic?" he whispered to his friend, Luna the owl.
                </p>
</div>
</article>
<!-- Navigation Controls (Large Arrows) -->
<div class="w-full flex justify-between items-center px-4 z-20">
<!-- Previous Button -->
<button aria-label="Previous Page" class="group flex items-center justify-center w-20 h-20 bg-white rounded-full shadow-[0_8px_0px_0px_rgba(203,196,210,1)] active:shadow-none active:translate-y-[8px] transition-all border-4 border-outline-variant hover:bg-surface-container-low">
<span class="material-symbols-outlined text-5xl text-outline font-bold">arrow_back_ios_new</span>
</button>
<!-- Progress Indicator Dots -->
<div class="flex gap-3">
<div class="w-4 h-4 rounded-full bg-outline-variant/50"></div>
<div class="w-4 h-4 rounded-full bg-outline-variant/50"></div>
<div class="w-5 h-5 rounded-full bg-primary shadow-sm scale-110"></div>
<div class="w-4 h-4 rounded-full bg-outline-variant/50"></div>
<div class="w-4 h-4 rounded-full bg-outline-variant/50"></div>
</div>
<!-- Next Button (Primary Action) -->
<button aria-label="Next Page" class="group flex items-center justify-center w-24 h-24 bg-primary rounded-[2rem] shadow-child-btn active:shadow-child-btn-active active:translate-y-[8px] transition-all border-4 border-primary-container">
<span class="material-symbols-outlined text-6xl text-white font-bold" style="font-variation-settings: 'FILL' 1;">arrow_forward_ios</span>
</button>
</div>
</main>
<!-- Decorative Elements Background -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-40">
<div class="absolute top-[10%] left-[5%] w-32 h-32 bg-secondary-container rounded-full mix-blend-multiply filter blur-2xl"></div>
<div class="absolute bottom-[20%] right-[10%] w-48 h-48 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
<div class="absolute top-[40%] right-[5%] w-24 h-24 bg-tertiary-container rounded-full mix-blend-multiply filter blur-xl opacity-50"></div>
</div>

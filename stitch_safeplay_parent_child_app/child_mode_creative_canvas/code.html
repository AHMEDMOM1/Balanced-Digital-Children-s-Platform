<body class="bg-background text-on-background min-h-screen flex flex-col font-sans child-canvas-bg">
<!-- TopAppBar -->
<header class="bg-primary dark:bg-primary-container font-parent-title text-parent-title docked full-width top-0 rounded-b-xl shadow-xl shadow-primary/20 fixed w-full z-50 flex justify-between items-center px-parent-padding-h h-16">

<span class="material-symbols-outlined text-3xl">timer</span>
</button>
<h1 class="text-parent-title font-parent-title font-bold text-on-primary">SafePlay Timer</h1>
<button class="text-on-primary hover:opacity-80 active:scale-95 transition-transform flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined text-3xl">lock</span>
</button>
</header>
<!-- Main Canvas Area -->
<main class="flex-grow pt-24 pb-32 px-child-padding-h flex flex-col items-center justify-center max-w-4xl mx-auto w-full gap-child-gap">
<!-- Header Actions -->
<div class="w-full flex justify-between items-center px-4 gap-4">
<button class="bg-white text-error font-parent-subtitle text-parent-subtitle px-4 py-2.5 rounded-full soft-shadow active:active-btn-shadow transition-all flex items-center gap-1.5 border-b-4 border-error/20 flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">delete</span>
                Clear
            </button>
<div class="bg-white rounded-full px-4 py-2.5 soft-shadow flex items-center gap-1.5 border-b-4 border-surface-container-high flex-shrink-0">
<span class="material-symbols-outlined text-tertiary text-[20px]">star</span>
<span class="font-parent-subtitle text-parent-subtitle text-tertiary">Creative</span>
</div>
<button class="bg-primary text-white font-parent-subtitle text-parent-subtitle px-4 py-2.5 rounded-full soft-shadow active:active-btn-shadow transition-all flex items-center gap-1.5 border-b-4 border-on-primary-fixed-variant flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">save</span>
                Save
            </button>
</div>
<!-- The Canvas -->
<div class="w-full aspect-video bg-white rounded-[32px] soft-shadow relative overflow-hidden border-4 border-white flex items-center justify-center">
<!-- Simulated drawing content for visual context -->
<div class="w-3/4 h-3/4 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at center, #cfbcff 2px, transparent 2px); background-size: 20px 20px;"></div>
<span class="absolute text-surface-variant font-child-hero text-child-hero">Draw here!</span>
</div>
<!-- Tool Palette -->
<div class="w-full bg-white rounded-[32px] soft-shadow p-6 flex flex-col gap-6">
<!-- Tools -->
<div class="flex justify-center items-center gap-6 overflow-x-auto pb-2">
<button class="flex flex-col items-center gap-2 p-4 rounded-2xl bg-primary-container text-on-primary-container active:scale-95 transition-transform shadow-inner">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">brush</span>
</button>
<button class="flex flex-col items-center gap-2 p-4 rounded-2xl bg-surface-container hover:bg-surface-container-highest text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-4xl">edit</span>
</button>
<button class="flex flex-col items-center gap-2 p-4 rounded-2xl bg-surface-container hover:bg-surface-container-highest text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-4xl">format_paint</span>
</button>
<div class="w-1 h-12 bg-surface-variant rounded-full mx-2"></div>
<button class="flex flex-col items-center gap-2 p-4 rounded-2xl bg-surface-container hover:bg-surface-container-highest text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-4xl">ink_eraser</span>
</button>
<button class="flex flex-col items-center gap-2 p-4 rounded-2xl bg-surface-container hover:bg-surface-container-highest text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-4xl">undo</span>
</button>
</div>
<!-- Colors -->
<div class="flex justify-center items-center gap-4 overflow-x-auto">
<button class="w-14 h-14 rounded-full bg-error border-4 border-white shadow-md active:scale-95 transition-transform"></button>
<button class="w-14 h-14 rounded-full bg-[#FF9800] border-4 border-white shadow-md active:scale-95 transition-transform"></button>
<button class="w-14 h-14 rounded-full bg-tertiary-fixed-dim border-4 border-white shadow-md active:scale-95 transition-transform"></button>
<button class="w-14 h-14 rounded-full bg-[#4CAF50] border-4 border-white shadow-md active:scale-95 transition-transform"></button>
<button class="w-16 h-16 rounded-full bg-primary border-4 border-primary-fixed shadow-lg active:scale-95 transition-transform transform -translate-y-1"></button>
<button class="w-14 h-14 rounded-full bg-[#9C27B0] border-4 border-white shadow-md active:scale-95 transition-transform"></button>
<button class="w-14 h-14 rounded-full bg-on-surface border-4 border-white shadow-md active:scale-95 transition-transform"></button>
</div>
<!-- Stroke Width -->
<div class="flex items-center justify-center gap-4 px-8">
<div class="w-2 h-2 rounded-full bg-outline"></div>
<div class="flex-grow h-4 bg-surface-container rounded-full relative">
<div class="absolute left-1/3 top-1/2 -translate-y-1/2 w-6 h-6 bg-primary rounded-full shadow-md cursor-pointer border-2 border-white"></div>
</div>
<div class="w-6 h-6 rounded-full bg-outline"></div>

<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">home</span>
            Home
        </a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-high transition-colors active:scale-98 w-full h-full rounded-xl" href="#">

            Reports
        </a>

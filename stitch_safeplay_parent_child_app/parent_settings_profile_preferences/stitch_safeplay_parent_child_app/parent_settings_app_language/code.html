<body class="bg-background text-on-background min-h-screen flex flex-col font-sans">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim docked full-width top-0 border-b border-outline-variant dark:border-outline flat no shadows flex justify-between items-center w-full px-parent-padding-h py-parent-padding-v">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:opacity-80 transition-opacity p-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-parent-title text-parent-title text-on-surface dark:text-on-surface">Parental Control</h1>
</div>
<div class="flex items-center">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:opacity-80 transition-opacity p-2 rounded-full">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex justify-center items-start pt-8 pb-24 px-4 md:px-8">
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl border border-outline-variant p-6 shadow-sm">
<div class="mb-6">
<h2 class="font-parent-subtitle text-parent-subtitle text-on-surface mb-2">App Language</h2>
<p class="font-parent-body text-parent-body text-on-surface-variant">Select the primary language for the parental dashboard.</p>
</div>
<!-- Search Bar -->
<div class="mb-6 relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full pl-10 pr-4 py-2 border border-outline-variant rounded-lg bg-surface font-parent-body text-parent-body text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" placeholder="Search languages..." type="text"/>
</div>
<!-- Language List -->
<div class="space-y-2 mb-8"><!-- English (Selected) -->
<label class="flex items-center justify-between p-4 rounded-lg border border-primary bg-surface-container-low cursor-pointer hover:bg-surface-container-high transition-colors">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-parent-subtitle">EN</div>
<span class="font-parent-body text-parent-body text-on-surface">English</span>
</div>
<div class="w-5 h-5 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
</div>
</label>
<!-- Arabic -->
<label class="flex items-center justify-between p-4 rounded-lg border border-outline-variant bg-surface cursor-pointer hover:bg-surface-container transition-colors">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant font-parent-subtitle">AR</div>
<span class="font-parent-body text-parent-body text-on-surface">Arabic</span>
</div>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant"></div>
</label>
<!-- Turkish -->
<label class="flex items-center justify-between p-4 rounded-lg border border-outline-variant bg-surface cursor-pointer hover:bg-surface-container transition-colors">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant font-parent-subtitle">TR</div>
<span class="font-parent-body text-parent-body text-on-surface">Türkçe</span>
</div>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant"></div>
</label></div>
<!-- Save Button -->
<div class="flex justify-end pt-4 border-t border-outline-variant">
<button class="bg-primary text-on-primary font-parent-subtitle text-parent-subtitle px-6 py-2 rounded-lg hover:opacity-90 transition-opacity active:scale-95">
                    Save Changes
                </button>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-surface dark:bg-surface-dim py-3 px-parent-padding-h border-t border-outline-variant dark:border-outline flat no shadows">

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-parent-caption text-parent-caption">Settings</span>
</a>

<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Parent Mode Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-background": "#1d1b20",
                      "on-secondary-fixed": "#1f1635",
                      "inverse-primary": "#cfbcff",
                      "secondary-container": "#e1d4fd",
                      "on-surface": "#1d1b20",
                      "outline-variant": "#cbc4d2",
                      "on-secondary": "#ffffff",
                      "error": "#ba1a1a",
                      "tertiary-fixed": "#ffdf93",
                      "on-tertiary": "#ffffff",
                      "surface-bright": "#fdf7ff",
                      "inverse-on-surface": "#f5eff7",
                      "secondary": "#63597c",
                      "primary": "#4f378a",
                      "on-error": "#ffffff",
                      "surface-tint": "#6750a4",
                      "secondary-fixed": "#e9ddff",
                      "on-primary-fixed": "#22005d",
                      "secondary-fixed-dim": "#cdc0e9",
                      "primary-container": "#6750a4",
                      "on-error-container": "#93000a",
                      "on-primary-fixed-variant": "#4f378a",
                      "surface-container-high": "#ece6ee",
                      "on-secondary-fixed-variant": "#4b4263",
                      "surface-container-low": "#f8f2fa",
                      "outline": "#7a7582",
                      "on-tertiary-fixed": "#241a00",
                      "tertiary-fixed-dim": "#e7c365",
                      "inverse-surface": "#322f35",
                      "on-surface-variant": "#494551",
                      "on-tertiary-container": "#503d00",
                      "primary-fixed-dim": "#cfbcff",
                      "on-secondary-container": "#645a7d",
                      "surface-container-highest": "#e6e0e9",
                      "surface-variant": "#e6e0e9",
                      "surface-dim": "#ded8e0",
                      "on-primary": "#ffffff",
                      "surface-container": "#f2ecf4",
                      "surface": "#fdf7ff",
                      "primary-fixed": "#e9ddff",
                      "tertiary": "#765b00",
                      "on-tertiary-fixed-variant": "#594400",
                      "tertiary-container": "#c9a74d",
                      "background": "#fdf7ff",
                      "error-container": "#ffdad6",
                      "on-primary-container": "#e0d2ff",
                      "surface-container-lowest": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "child-gap": "20px",
                      "parent-padding-v": "16px",
                      "child-padding-h": "24px",
                      "parent-padding-h": "20px",
                      "parent-gap": "12px"
              },
              "fontFamily": {
                  "sans": ["Inter", "sans-serif"]
              },
              "fontSize": {
                      "child-title": [
                              "24px",
                              {
                                      "lineHeight": "1.3",
                                      "fontWeight": "700"
                              }
                      ],
                      "parent-body": [
                              "15px",
                              {
                                      "lineHeight": "1.5",
                                      "fontWeight": "400"
                              }
                      ],
                      "parent-title": [
                              "22px",
                              {
                                      "lineHeight": "1.3",
                                      "fontWeight": "700"
                              }
                      ],
                      "child-body": [
                              "18px",
                              {
                                      "lineHeight": "1.6",
                                      "fontWeight": "400"
                              }
                      ],
                      "child-subtitle": [
                              "20px",
                              {
                                      "lineHeight": "1.4",
                                      "fontWeight": "600"
                              }
                      ],
                      "child-hero": [
                              "32px",
                              {
                                      "lineHeight": "1.2",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "parent-subtitle": [
                              "18px",
                              {
                                      "lineHeight": "1.4",
                                      "fontWeight": "600"
                              }
                      ],
                      "parent-caption": [
                              "13px",
                              {
                                      "lineHeight": "1.4",
                                      "fontWeight": "400"
                              }
                      ]
              }
      },
          },
        }
      </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-low text-on-surface font-sans min-h-screen flex items-center justify-center p-4">
<!-- Login Container -->
<main class="w-full max-w-md bg-surface rounded-xl border border-outline-variant shadow-sm overflow-hidden flex flex-col">
<!-- Header Section -->
<header class="pt-8 pb-6 px-parent-padding-h text-center flex flex-col items-center gap-4">
<div class="w-16 h-16 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
</div>
<div>
<h1 class="font-parent-title text-parent-title text-on-surface mb-2">Parental Access</h1>
<p class="font-parent-body text-parent-body text-on-surface-variant">Enter your 4-digit PIN to access dashboard.</p>
</div>
</header>
<!-- PIN Entry Display -->
<section class="px-parent-padding-h pb-8 flex justify-center gap-4">
<!-- PIN Dots -->
<div class="w-4 h-4 rounded-full bg-primary"></div>
<div class="w-4 h-4 rounded-full bg-primary"></div>
<div class="w-4 h-4 rounded-full bg-surface-variant border border-outline-variant"></div>
<div class="w-4 h-4 rounded-full bg-surface-variant border border-outline-variant"></div>
</section>
<!-- Keypad -->
<section class="bg-surface-container-lowest px-parent-padding-h py-8 border-t border-outline-variant">
<div class="grid grid-cols-3 gap-y-6 gap-x-4 max-w-[280px] mx-auto">
<!-- Row 1 -->
<button class="h-14 rounded-full flex items-center justify-center font-parent-title text-parent-title text-on-surface hover:bg-surface-variant transition-colors active:scale-95">1</button>
<button class="h-14 rounded-full flex items-center justify-center font-parent-title text-parent-title text-on-surface hover:bg-surface-variant transition-colors active:scale-95">2</button>
<button class="h-14 rounded-full flex items-center justify-center font-parent-title text-parent-title text-on-surface hover:bg-surface-variant transition-colors active:scale-95">3</button>
<!-- Row 2 -->
<button class="h-14 rounded-full flex items-center justify-center font-parent-title text-parent-title text-on-surface hover:bg-surface-variant transition-colors active:scale-95">4</button>
<button class="h-14 rounded-full flex items-center justify-center font-parent-title text-parent-title text-on-surface hover:bg-surface-variant transition-colors active:scale-95">5</button>
<button class="h-14 rounded-full flex items-center justify-center font-parent-title text-parent-title text-on-surface hover:bg-surface-variant transition-colors active:scale-95">6</button>
<!-- Row 3 -->
<button class="h-14 rounded-full flex items-center justify-center font-parent-title text-parent-title text-on-surface hover:bg-surface-variant transition-colors active:scale-95">7</button>
<button class="h-14 rounded-full flex items-center justify-center font-parent-title text-parent-title text-on-surface hover:bg-surface-variant transition-colors active:scale-95">8</button>
<button class="h-14 rounded-full flex items-center justify-center font-parent-title text-parent-title text-on-surface hover:bg-surface-variant transition-colors active:scale-95">9</button>
<!-- Row 4 -->
<button class="h-14 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors active:scale-95">
<span class="material-symbols-outlined">fingerprint</span>
</button>
<button class="h-14 rounded-full flex items-center justify-center font-parent-title text-parent-title text-on-surface hover:bg-surface-variant transition-colors active:scale-95">0</button>
<button class="h-14 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors active:scale-95">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
</section>
<!-- Footer Actions -->
<footer class="p-parent-padding-v text-center bg-surface-container-lowest pb-6">
<button class="font-parent-caption text-parent-caption text-primary hover:underline transition-all">Forgot PIN?</button>
</footer>
</main>
</body></html>
